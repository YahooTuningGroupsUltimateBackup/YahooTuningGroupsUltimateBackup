<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
    <meta name="viewport"
content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Yahoo Tuning Groups Ultimate Backup Search</title>
</head>
<body>
<a href='/'>back to root</a>
<h1>Search</h1>
<form id="search-form" action="/search/" method="get">
    <div>
        <input type="text" name="q" size="60" placeholder="FTS5 query: bare words, &quot;phrases&quot;, OR, NOT, NEAR()">
        <button>search</button>
    </div>
    <div>
        <label>list <select name="list"><option value="">all lists</option></select></label>
        <span id="topic-scope"></span>
    </div>
    <div>
        <label>author <input type="text" name="author"></label>
    </div>
    <div>
        <label>after <input type="text" name="after" size="10" placeholder="2001-05"></label>
        <label>before <input type="text" name="before" size="10" placeholder="2003"></label>
    </div>
</form>
<p id="status"></p>
<div id="results"></div>
<script src="lib/index.js"></script>
<script src="querySql.js"></script>
<script src="search-page.js"></script>
</body>
</html>
